name: Список категорий в редакторе

on:
  push:
    branches: [main]
    paths:
      - data/sections.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-cms-sections.js
      - name: Сохранить обновлённый список
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages.yml
          git diff --cached --quiet && exit 0
          git commit -m "редактор: список категорий по разделам"
          git push
