# Pages CMS — https://app.pagescms.org
# Репозиторий: Amvilina/sharprayz-web, ветка main

media:
  - name: assets
    label: Общие картинки (логотип, баннер, SEO)
    input: assets
    output: assets
    extensions: [png, jpg, jpeg, webp, gif, svg]
  - name: products
    label: Фото товаров
    input: assets/products
    output: assets/products
    extensions: [png, jpg, jpeg, webp]

settings:
  commit:
    templates:
      create: "контент: добавлено {path}"
      update: "контент: обновлено {path}"
      delete: "контент: удалено {path}"

content:
  - name: sharprayz
    label: ШАРПРАЙЗ
    type: group
    items:
      - name: site
        label: Настройки сайта
        type: file
        path: data/site.json
        format: json
        fields:
          - name: shop
            label: Контакты и адрес
            type: object
            fields:
              - name: phone
                label: "Телефон (как на сайте)"
                type: string
                required: true
              - name: phoneTel
                label: "Телефон для ссылки tel"
                type: string
                required: true
                description: "Только цифры и +, например +79691010199"
              - name: email
                label: Email
                type: string
                required: true
              - name: address
                label: Адрес
                type: text
                required: true
              - name: mapLat
                label: Широта карты
                type: number
              - name: mapLon
                label: Долгота карты
                type: number
              - name: mapZoom
                label: Масштаб карты
                type: number
              - name: hoursOrder
                label: Приём заказов
                type: string
              - name: hoursDelivery
                label: Доставка
                type: string
              - name: callbackHours
                label: Заказ звонка
                type: string
              - name: vkUrl
                label: "Ссылка ВКонтакте"
                type: string
              - name: instagramUrl
                label: "Ссылка Instagram"
                type: string

          - name: order
            label: Заказы на почту
            type: object
            fields:
              - name: notifyEmail
                label: Email для FormSubmit
                type: string
                required: true
                description: "Сюда приходят заявки с сайта (formsubmit.co). После первой заявки подтвердите письмо Activate."

          - name: productImage
            label: Картинка по умолчанию для товаров
            type: image
            options:
              media: assets
              path: assets

          - name: heroImage
            label: Баннер на главной
            type: image
            options:
              media: assets
              path: assets

          - name: seo
            label: SEO
            type: object
            fields:
              - name: siteUrl
                label: "Адрес сайта (без слэша в конце)"
                type: string
                description: "Например https://sharprayz.ru — для canonical и Open Graph."
              - name: title
                label: "Заголовок (title)"
                type: string
                required: true
              - name: description
                label: Описание
                type: text
                required: true
              - name: keywords
                label: Ключевые слова
                type: text
              - name: ogImage
                label: Картинка для соцсетей
                type: image
                options:
                  media: assets
                  path: assets

          - name: hero
            label: "Блок герой на главной"
            type: object
            fields:
              - name: badge
                label: Бейдж
                type: string
              - name: title
                label: Заголовок
                type: string
                required: true
              - name: lead
                label: Подзаголовок
                type: text

          - name: paymentMethods
            label: Способы оплаты
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: id
                label: ID
                type: string
                required: true
              - name: label
                label: Название
                type: string
                required: true
              - name: description
                label: Описание
                type: text

      - name: sections
        label: Разделы каталога
        type: file
        path: data/sections.json
        format: json
        list: true
        view:
          primary: label
          sort: label
          order: asc
        fields:
          - name: label
            label: Название раздела
            type: string
            required: true
          - name: links
            label: "Подкатегории (необязательно)"
            type: string
            list: true
          - name: id
            label: Служебное
            type: string
            hidden: true

      - name: products
        label: Каталог товаров
        type: file
        path: data/products.json
        format: json
        list: true
        view:
          primary: title
          fields: [section, price, badge]
          sort: section
          order: asc
        fields:
          - name: id
            label: Код товара
            type: string
            hidden: true
          - name: title
            label: Название
            type: string
            required: true
          - name: description
            label: Описание
            type: text
            required: true
          - name: price
            label: Цена
            type: number
            required: true
            description: "В рублях. На сайте и в корзине будет одна и та же сумма."
          - name: section
            label: Разделы
            type: select
            required: true
            options:
              multiple: true
